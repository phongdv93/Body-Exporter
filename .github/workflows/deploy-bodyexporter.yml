# Auto-deploy bodyexporter.com → VPS (systemd: bodyexporter, port 8002)
# GitHub repo → Settings → Secrets → Actions (same as nesting.click):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY; optional DEPLOY_SSH_PORT (default 22)
name: Deploy bodyexporter.com

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-bodyexporter.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bodyexporter
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rsync website + install + restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "Missing GitHub secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY"
            exit 1
          fi
          PORT="${DEPLOY_SSH_PORT:-22}"
          APP_DIR="/var/www/bodyexporter.com/website"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'uploads/' \
            --exclude '.pytest_cache/' \
            -e "$RSYNC_SSH" \
            website/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${APP_DIR}/"

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          APP_DIR="/var/www/bodyexporter.com/website"
          cd "\$APP_DIR"
          if [ ! -f .env ]; then
            echo "ERROR: \$APP_DIR/.env missing on server (create once manually, never rsync from git)."
            exit 1
          fi
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo systemctl restart bodyexporter
          sleep 2
          sudo systemctl is-active --quiet bodyexporter
          curl -fsS "http://127.0.0.1:8002/robots.txt" | head -n 1
          echo "Deploy OK: bodyexporter on port 8002"
          EOF
